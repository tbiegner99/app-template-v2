# Short-name aliases for container names, used by the __SLUG__ CLI so you
# don't have to type the slug-prefixed name every time.
#
# Format: alias=real-container-name  (one per line, '#' comments allowed)
# Add new aliases with: __SLUG__ alias add <alias> <container>

ui=__SLUG__-ui
be=__SLUG__-go-backend
backend=__SLUG__-go-backend
go-backend=__SLUG__-go-backend
db=__SLUG__-postgres
postgres=__SLUG__-postgres
supertokens=__SLUG__-supertokens
auth=__SLUG__-supertokens
