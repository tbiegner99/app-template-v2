server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html/control-center;

    # API — proxy to Go backend container
    location /api/__SLUG__/ {
        proxy_pass http://__SLUG__-go-backend:8080/api/__SLUG__/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # control-center app — proxy to dev server with static fallback
    location /__SLUG__/control-center/ {
        proxy_pass http://host.docker.internal:8001/__SLUG__/control-center/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_intercept_errors on;
        error_page 502 503 504 = @static;
    }

    location @static {
        rewrite ^/__SLUG__/control-center/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    # Redirect root to control-center
    location = / {
        return 301 /__SLUG__/control-center/;
    }

    # SuperTokens redirects unauthenticated users to /auth — send to app
    location /auth {
        return 301 /__SLUG__/control-center/auth$is_args$args;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
